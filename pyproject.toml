[project]
name = "asc-metadata-verifier"
version = "0.1.0"
description = "LLM-as-judge gate for App Store Connect metadata"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.0",
    "httpx>=0.28.1",
    "logfire>=4.40.0",
    "openai>=1.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.27.0",
    "pydantic-evals>=2.27.0",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.optional-dependencies]
# Optional, offline-by-default semantic recall backend. Never a core
# dependency: `persistence/semantic.py` only imports `chromadb` lazily
# (inside `ChromaIndex.__init__`), so the default install and its tests
# never need this extra, and CI never downloads it.
semantic = ["chromadb>=0.5"]
# Optional, offline deep-code-analysis backend. Never a core dependency:
# `code/backends/treesitter.py` imports tree-sitter lazily, so the default
# install and its tests never need this extra, and `verify` is unchanged.
code = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.20"]

[project.scripts]
asc-verify = "asc_metadata_verifier.cli:app"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's idiomatic API requires typer.Argument()/typer.Option() calls as
# parameter defaults (it inspects the default instance for CLI metadata);
# bugbear's "no function calls in defaults" check doesn't fit that pattern.
"src/asc_metadata_verifier/cli.py" = ["B008"]
# The HTML report is a templating module: long inline HTML/SVG string literals
# and verbatim CSS/JS are unavoidable, and wrapping them hurts fidelity and
# readability. Line-length is not a useful signal for these two files.
"src/asc_metadata_verifier/html_report.py" = ["E501"]
"src/asc_metadata_verifier/html_report_assets.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
